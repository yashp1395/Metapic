# ──────────────────────────────────────────────
# KwikPic Spring Boot Configuration
# ──────────────────────────────────────────────

server.port=${PORT:4000}

# ── MongoDB ──
spring.data.mongodb.uri=${MONGO_URI:mongodb://localhost:27017/kwikpic}

# ── JWT ──
jwt.secret=${JWT_SECRET:supersecretkey}

# ── Cloudinary ──
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# ── Face Service ──
face.service.url=${FACE_SERVICE_URL:http://localhost:8000}

# ── Match Threshold ──
match.threshold=${MATCH_THRESHOLD:0.38}

# ── Frontend URL (for CORS) ──
frontend.url=${FRONTEND_URL:http://localhost:5173}

# ── Multipart (file upload limits) ──
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=100MB

# ── Rate Limiting ──
rate.limit.max-requests=120
rate.limit.window-ms=60000

# ── Mail / SMTP ──
spring.mail.host=${SMTP_HOST:smtp.mailtrap.io}
spring.mail.port=${SMTP_PORT:2525}
spring.mail.username=${SMTP_USER:}
spring.mail.password=${SMTP_PASS:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
